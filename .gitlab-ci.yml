  extends: [ ".test:pmOS:check", ".image:pmOS:v25_06" ]
  needs: [ "build:pmOS:v25_06" ]

test:pmOS:v25_06:fuzz:
  extends: [ ".test:pmOS:fuzz", ".image:pmOS:v25_06" ]
  needs: [ "build:pmOS:v25_06" ]

build:pmOS:edge:
  extends: [ ".build:pmOS", ".image:pmOS:edge" ]

test:pmOS:edge:check:
  extends: [ ".test:pmOS:check", ".image:pmOS:edge" ]
  needs: [ "build:pmOS:edge" ]

test:pmOS:edge:fuzz:
  extends: [ ".test:pmOS:fuzz", ".image:pmOS:edge" ]
  needs: [ "build:pmOS:edge" ]

